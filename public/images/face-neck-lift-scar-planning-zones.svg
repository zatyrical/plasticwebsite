<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Facelift scar-planning zones around the hairline and ear</title>
  <desc id="desc">A simplified educational side-profile diagram highlighting broad hairline and around-ear planning zones, with notes that the exact path varies by anatomy and technique and that all surgical scars take time to mature.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#efe7da"/>
    </linearGradient>
    <linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ead8b7" stop-opacity=".42"/>
      <stop offset="1" stop-color="#b79559" stop-opacity=".10"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#10201d" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1400" height="900" rx="42" fill="url(#bg)"/>
  <text x="74" y="75" fill="#a97732" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">SCAR-PLANNING GUIDE</text>
  <text x="74" y="124" fill="#10201d" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Where facelift scar planning is discussed</text>
  <text x="74" y="160" fill="#4b5c57" font-family="Arial, Helvetica, sans-serif" font-size="20">Broad zones—not a promised incision path. The individual plan depends on examination.</text>

  <g transform="translate(62 196)">
    <rect x="0" y="0" width="610" height="598" rx="30" fill="#ffffff" fill-opacity=".78" stroke="#d7ccbb" stroke-width="2"/>
    <circle cx="305" cy="292" r="242" fill="url(#portrait)"/>
    <circle cx="305" cy="292" r="220" fill="none" stroke="#b79559" stroke-opacity=".20" stroke-width="2" stroke-dasharray="8 12"/>

    <g fill="none" stroke="#173d36" stroke-linecap="round" stroke-linejoin="round">
      <path d="M277 82 C218 105 194 171 210 240 C221 289 251 326 252 372 C253 428 222 486 201 548" stroke-width="7"/>
      <path d="M277 82 C354 70 423 111 431 180 C435 214 458 236 486 252 C499 260 497 278 480 286 L453 298 C462 312 457 324 445 331 C459 343 455 357 441 362 C454 389 437 411 403 419 C365 428 352 460 361 501 L380 548" stroke-width="7"/>
      <path d="M327 145 C367 134 400 150 418 177" stroke-width="4" stroke-opacity=".45"/>
      <path d="M426 224 C446 228 461 226 477 218" stroke-width="4" stroke-opacity=".45"/>
      <path d="M407 417 C369 420 329 407 299 382" stroke-width="4" stroke-opacity=".38"/>
    </g>

    <g fill="none" stroke="#bf8134" stroke-linecap="round">
      <path d="M268 89 C238 106 220 128 211 157" stroke-width="26" stroke-opacity=".27"/>
      <path d="M393 173 C420 190 427 219 423 247 C419 278 418 313 430 341 C439 363 439 389 427 409" stroke-width="29" stroke-opacity=".28"/>
    </g>

    <g font-family="Arial, Helvetica, sans-serif">
      <circle cx="190" cy="139" r="24" fill="#a86f2b"/>
      <text x="190" y="147" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">1</text>
      <path d="M165 139 H78" stroke="#a86f2b" stroke-width="3"/>
      <text x="56" y="125" fill="#17342e" font-size="20" font-weight="700">Hairline area</text>
      <text x="56" y="151" fill="#4b5c57" font-size="16">A broad planning zone</text>

      <circle cx="438" cy="305" r="24" fill="#a86f2b"/>
      <text x="438" y="313" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">2</text>
      <path d="M463 305 H548" stroke="#a86f2b" stroke-width="3"/>
      <text x="440" y="288" fill="#17342e" font-size="18" font-weight="700">Around the ear</text>
      <text x="440" y="330" fill="#4b5c57" font-size="16">Exact route varies</text>

      <rect x="76" y="514" width="458" height="54" rx="16" fill="#f3eadc"/>
      <text x="305" y="548" fill="#314843" font-size="17" text-anchor="middle">Highlighted areas are zones, not a surgical marking.</text>
    </g>
  </g>

  <g transform="translate(718 213)" font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <rect x="0" y="0" width="608" height="156" rx="24" fill="#ffffff" stroke="#10201d" stroke-opacity=".10"/>
    <circle cx="53" cy="52" r="25" fill="#a86f2b"/>
    <text x="53" y="60" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">1</text>
    <text x="94" y="49" fill="#10201d" font-size="25" font-weight="700">Hairline planning</text>
    <text x="34" y="94" fill="#40504c" font-size="18">Planning considers the patient’s existing hairline and the</text>
    <text x="34" y="122" fill="#40504c" font-size="18">areas being treated; a diagram cannot set the individual path.</text>

    <rect x="0" y="186" width="608" height="156" rx="24" fill="#ffffff" stroke="#10201d" stroke-opacity=".10"/>
    <circle cx="53" cy="238" r="25" fill="#a86f2b"/>
    <text x="53" y="246" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">2</text>
    <text x="94" y="235" fill="#10201d" font-size="25" font-weight="700">Around-ear anatomy</text>
    <text x="34" y="280" fill="#40504c" font-size="18">Scar placement is planned around ear anatomy and varies with</text>
    <text x="34" y="308" fill="#40504c" font-size="18">the technique, anatomy, goals and direction of tissue movement.</text>

    <rect x="0" y="372" width="608" height="156" rx="24" fill="#ffffff" stroke="#10201d" stroke-opacity=".10"/>
    <circle cx="53" cy="424" r="25" fill="#a86f2b"/>
    <text x="53" y="432" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">3</text>
    <text x="94" y="421" fill="#10201d" font-size="25" font-weight="700">Scar maturation</text>
    <text x="34" y="466" fill="#40504c" font-size="18">Scars change over months. Placement aims to reduce visibility</text>
    <text x="34" y="494" fill="#40504c" font-size="18">where possible, but no surgical scar disappears completely.</text>
  </g>

  <rect x="74" y="828" width="1252" height="1" fill="#cfc2ae"/>
  <text x="74" y="863" fill="#4b5c57" font-family="Arial, Helvetica, sans-serif" font-size="17">Simplified and not to scale. Only examination can determine an individual incision plan.</text>
</svg>
