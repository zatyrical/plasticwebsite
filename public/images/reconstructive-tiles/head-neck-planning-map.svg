<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1420" viewBox="0 0 640 1420" role="img" aria-labelledby="title desc">
  <title id="title">Head and neck reconstruction planning relationships</title>
  <desc id="desc">Defect and tissues, function and appearance, and cancer treatment when relevant inform an individual reconstructive plan. Recovery may include wound care, monitoring, speech and swallowing support, nutrition and dental planning. Later refinement may be discussed after healing and any required cancer treatment. These are discussion topics, not a fixed treatment sequence.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5d746b"/></marker></defs>
  <rect width="640" height="1420" rx="24" fill="#f6f2eb"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g fill="#17342e" font-size="33" font-weight="700">
      <text x="320" y="52">Planning head and neck</text>
      <text x="320" y="94">reconstruction</text>
    </g>
    <text x="320" y="140" fill="#4c625d" font-size="26">Several needs are considered together.</text>
    <g fill="#fff" stroke="#d9d1c4" stroke-width="2">
      <rect x="30" y="180" width="520" height="158" rx="18"/>
      <rect x="30" y="365" width="520" height="176" rx="18"/>
      <rect x="30" y="568" width="520" height="158" rx="18"/>
    </g>
    <g fill="#17342e" font-size="30" font-weight="700">
      <text x="290" y="224">Defect and tissues</text>
      <text x="290" y="409">Function and appearance</text>
      <text x="290" y="612">Cancer treatment</text>
    </g>
    <g fill="#4c625d" font-size="27">
      <text x="290" y="269">Location and tissue loss</text>
      <text x="290" y="308">Skin, soft tissue, bone, nerve or lining</text>
      <text x="290" y="454">Speech, swallowing, breathing</text>
      <text x="290" y="491">Facial movement, oral function</text>
      <text x="290" y="528">and visible contour</text>
      <text x="290" y="657">When relevant: coordination with</text>
      <text x="290" y="697">the cancer treatment team</text>
    </g>
    <g fill="none" stroke="#5d746b" stroke-width="3">
      <path d="M550 259 H596 V754 H320 V787" marker-end="url(#arrow)"/>
      <path d="M550 453 H596"/>
      <path d="M550 647 H596"/>
    </g>
    <rect x="30" y="802" width="580" height="162" rx="20" fill="#17342e"/>
    <text x="320" y="846" fill="#fff" font-size="30" font-weight="700">Individual reconstructive plan</text>
    <g fill="#e3ede7" font-size="27">
      <text x="320" y="892">Options depend on the defect,</text>
      <text x="320" y="933">patient factors and team assessment.</text>
    </g>
    <path d="M320 964 V1007" fill="none" stroke="#5d746b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="30" y="1022" width="580" height="169" rx="20" fill="#fff" stroke="#d9d1c4" stroke-width="2"/>
    <text x="320" y="1067" fill="#17342e" font-size="30" font-weight="700">Recovery and rehabilitation</text>
    <g fill="#4c625d" font-size="27">
      <text x="320" y="1110">Wound care and monitoring · nutrition</text>
      <text x="320" y="1145">Speech, swallowing and dental support</text>
      <text x="320" y="1180">Rehabilitation as needed</text>
    </g>
    <g fill="#17342e" font-size="26" font-weight="700">
      <text x="320" y="1240">Later refinement may be discussed after</text>
      <text x="320" y="1277">healing and any required cancer treatment.</text>
    </g>
    <g fill="#4c625d" font-size="25">
      <text x="320" y="1335">Discussion map, not a procedure-selection</text>
      <text x="320" y="1370">guide or fixed treatment sequence.</text>
    </g>
  </g>
</svg>
